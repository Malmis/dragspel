<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Dragspel</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem 4rem; }
  textarea { width: 100%; height: 300px; font-family: monospace; font-size: .95rem; box-sizing: border-box; }
  button { padding: .6rem 1.2rem; font-size: 1rem; margin-right: .5rem; }
  label { display: block; margin: .6rem 0; }
  input[type=number] { width: 5rem; }
  select { font-size: 1rem; padding: .2rem; }
  .row { display: flex; flex-wrap: wrap; gap: 1rem; }
  .row label { margin: .3rem 0; }
  .lang { display: flex; justify-content: flex-end; }
  #status { margin-top: 1rem; font-weight: 600; min-height: 1.2em; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; text-align: center; padding: .6rem; font-size: .85rem; color: #666; background: rgba(255,255,255,.9); border-top: 1px solid #ddd; }
</style>
</head>
<body>
<div class="lang">
  <label>🌐 <select id="lang">
    <option value="sv">Svenska</option>
    <option value="en">English</option>
  </select></label>
</div>

<h1>Dragspel</h1>
<p id="intro"></p>

<textarea id="notes">1 | Em | E4 0.5 E4 0.5 G4 0.5 A4 0.5 B4 1 E5 1 | E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5
2 | C | G4 1 C5 1 B4 0.5 A4 0.5 G4 1 | C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5
3 | G | G4 0.5 G4 0.5 A4 0.5 B4 0.5 D5 1 B4 1 | G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5
4 | D | A4 1 F#4 1 D4 2 | D2 0.5 D2 0.5 D2 0.5 D2 0.5 D2 0.5 D2 0.5 D2 0.5 D2 0.5
5 | Em | E5 0.5 E5 0.5 D5 0.5 B4 0.5 G4 1 A4 1 | E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5
6 | C | C5 0.5 C5 0.5 B4 0.5 A4 0.5 G4 2 | C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5
7 | G | D5 1 B4 1 G4 1 A4 1 | G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5
8 | D | D5 1 A4 1 F#4 1 D4 1 | D2 0.5 D2 0.5 D2 0.5 D2 0.5 D2 0.5 D2 0.5 D2 0.5 D2 0.5
9 | Em | E4 0.5 E4 0.5 G4 0.5 A4 0.5 B4 1 E5 1 | E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5
10 | C | G4 1 C5 1 B4 0.5 A4 0.5 G4 1 | C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5
11 | G | G4 0.5 G4 0.5 A4 0.5 B4 0.5 D5 1 B4 1 | G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5
12 | D | D4 0.5 D4 0.5 F#4 0.5 A4 0.5 B4 1 A4 1 | D2 0.5 D2 0.5 D2 0.5 D2 0.5 D2 0.5 D2 0.5 D2 0.5 D2 0.5
13 | Em | E4 1 G4 1 B4 1 E5 1 | E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5 E2 0.5
14 | C | C5 1 G4 1 E4 1 G4 1 | C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5 C2 0.5
15 | G | B4 1 D5 1 B4 1 G4 1 | G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5 G2 0.5
16 | Em | E4 4 | E2 1 E2 1 E2 2</textarea>

<div class="row">
  <label><span data-i18n="melody">Melodi</span>:
    <select id="melInst">
      <option value="accordion" data-i18n="inst.accordion">Dragspel</option>
      <option value="trumpet" data-i18n="inst.trumpet">Trumpet</option>
      <option value="harmonica" data-i18n="inst.harmonica">Munspel</option>
      <option value="saxophone" selected data-i18n="inst.saxophone">Saxofon</option>
    </select>
  </label>
  <label><span data-i18n="bass">Bas</span>:
    <select id="basInst">
      <option value="accordion" selected data-i18n="inst.accordion">Dragspel</option>
      <option value="trumpet" data-i18n="inst.trumpet">Trumpet</option>
      <option value="harmonica" data-i18n="inst.harmonica">Munspel</option>
      <option value="saxophone" data-i18n="inst.saxophone">Saxofon</option>
    </select>
  </label>
  <label><span data-i18n="drums">Trummor</span>:
    <select id="drumStyle">
      <option value="off" data-i18n="drum.off">Av</option>
      <option value="rock" data-i18n="drum.rock">Rock 4/4</option>
      <option value="polka" selected data-i18n="drum.polka">Polka</option>
      <option value="swing" data-i18n="drum.swing">Swing</option>
    </select>
  </label>
</div>

<div class="row">
  <label><span data-i18n="volMel">Volym melodi</span>: <input id="melVol" type="range" min="0" max="1.5" step="0.05" value="1"></label>
  <label><span data-i18n="volBas">Volym bas</span>: <input id="basVol" type="range" min="0" max="1.5" step="0.05" value="1"></label>
  <label><span data-i18n="volDrums">Volym trummor</span>: <input id="drumVol" type="range" min="0" max="1.5" step="0.05" value="0.8"></label>
</div>

<label><span data-i18n="tempo">Tempo (BPM)</span>: <input id="bpm" type="number" value="180" min="30" max="240"></label>
<label><span data-i18n="bellows">Balgens tremolo (dragspel)</span>: <input id="bellows" type="range" min="0" max="1" step="0.05" value="0.3"></label>
<label><span data-i18n="repeats">Antal varv</span>: <input id="repeats" type="number" value="0" min="0" max="999"> <span data-i18n="repeatsHint">(0 = oändligt)</span></label>
<label><span data-i18n="gap">Paus mellan varv (taktslag)</span>: <input id="gap" type="number" value="0" min="0" max="16" step="0.5"></label>

<button id="play" data-i18n="play">Spela</button>
<button id="stop" data-i18n="stop">Stoppa</button>
<div id="status"></div>

<footer>Created with Claude by Malmis</footer>

<script>
// ---------- Språk ----------
const TEXT = {
  sv: {
    intro: 'Skriv en rad per takt: <code>Takt | Ackord | Melodi | Bas</code>.<br>Noter skrivs som <code>Namn+oktav längd</code>, t.ex. <code>C4 1</code>. Paus: <code>R 1</code>. Längden är i taktslag. Melodi och bas på samma rad spelas samtidigt och ska summera till samma antal taktslag. Kolumnerna kan separeras med <code>|</code> eller tabb. Rader utan siffror (rubriker) hoppas över.',
    melody: 'Melodi', bass: 'Bas', drums: 'Trummor',
    'inst.accordion': 'Dragspel', 'inst.trumpet': 'Trumpet', 'inst.harmonica': 'Munspel', 'inst.saxophone': 'Saxofon',
    'drum.off': 'Av', 'drum.rock': 'Rock 4/4', 'drum.polka': 'Polka', 'drum.swing': 'Swing',
    volMel: 'Volym melodi', volBas: 'Volym bas', volDrums: 'Volym trummor',
    tempo: 'Tempo (BPM)', bellows: 'Balgens tremolo (dragspel)', repeats: 'Antal varv',
    repeatsHint: '(0 = oändligt)', gap: 'Paus mellan varv (taktslag)',
    play: 'Spela', stop: 'Stoppa',
    pass: n => `Varv ${n}`,
    passOf: (n, m) => `Varv ${n} av ${m}`,
    bar: n => `Takt ${n}`,
    done: 'Klar',
    errNoBars: 'Inga takter hittades.',
    errLenMissing: bar => `Takt ${bar}: varje not behöver en längd, t.ex. "C4 1".`,
    errLenInvalid: (bar, tok) => `Takt ${bar}: ogiltig längd efter "${tok}".`,
    errNote: (bar, tok) => `Takt ${bar}: ogiltig not "${tok}".`,
    errBeats: (bar, m, b) => `Takt ${bar}: melodin har ${m} taktslag men basen ${b}.`,
  },
  en: {
    intro: 'Write one line per bar: <code>Bar | Chord | Melody | Bass</code>.<br>Notes are written as <code>Name+octave length</code>, e.g. <code>C4 1</code>. Rest: <code>R 1</code>. Length is in beats. Melody and bass on the same line play at the same time and must add up to the same number of beats. Columns can be separated by <code>|</code> or tab. Lines without numbers (headers) are skipped.',
    melody: 'Melody', bass: 'Bass', drums: 'Drums',
    'inst.accordion': 'Accordion', 'inst.trumpet': 'Trumpet', 'inst.harmonica': 'Harmonica', 'inst.saxophone': 'Saxophone',
    'drum.off': 'Off', 'drum.rock': 'Rock 4/4', 'drum.polka': 'Polka', 'drum.swing': 'Swing',
    volMel: 'Melody volume', volBas: 'Bass volume', volDrums: 'Drum volume',
    tempo: 'Tempo (BPM)', bellows: 'Bellows tremolo (accordion)', repeats: 'Repeats',
    repeatsHint: '(0 = infinite)', gap: 'Pause between repeats (beats)',
    play: 'Play', stop: 'Stop',
    pass: n => `Pass ${n}`,
    passOf: (n, m) => `Pass ${n} of ${m}`,
    bar: n => `Bar ${n}`,
    done: 'Done',
    errNoBars: 'No bars found.',
    errLenMissing: bar => `Bar ${bar}: every note needs a length, e.g. "C4 1".`,
    errLenInvalid: (bar, tok) => `Bar ${bar}: invalid length after "${tok}".`,
    errNote: (bar, tok) => `Bar ${bar}: invalid note "${tok}".`,
    errBeats: (bar, m, b) => `Bar ${bar}: melody has ${m} beats but bass has ${b}.`,
  },
};

// Väljer språk utifrån webbläsarens språkinställning. Engelska om det är först
// i listan bland sv/en, annars svenska.
function detectLang() {
  const prefs = navigator.languages && navigator.languages.length
    ? navigator.languages
    : [navigator.language || 'sv'];
  const match = prefs.find(l => /^(en|sv)\b/i.test(l));
  return match && match.toLowerCase().startsWith('en') ? 'en' : 'sv';
}

let lang = detectLang();
const t = (key, ...args) => {
  const v = TEXT[lang][key];
  return typeof v === 'function' ? v(...args) : v;
};

function applyLang() {
  document.documentElement.lang = lang;
  document.getElementById('lang').value = lang;
  document.getElementById('intro').innerHTML = t('intro');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
}

document.getElementById('lang').onchange = e => {
  lang = e.target.value;
  applyLang();
};

const OFFS = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const LOOKAHEAD = 0.5;   // sekunder schemalagda i förväg
const TICK_MS = 100;     // hur ofta schemaläggaren körs

// Klangprofiler för varje instrument
const INST = {
  accordion: {
    peak: 0.35, attack: 0.02, release: 0.06,
    lp: 1500, lpK: 1, sweep: 0,
    vibRate: 0, vibCents: 0,
    reeds: [
      { type: 'sawtooth', mult: 1, detune: -7, gain: 0.25 },
      { type: 'sawtooth', mult: 1, detune: 7,  gain: 0.25 },
      { type: 'square',   mult: 2, detune: 0,  gain: 0.08 },
    ],
  },
  trumpet: {
    peak: 0.28, attack: 0.03, release: 0.08,
    lp: 900, lpK: 1.2, sweep: 1800,
    vibRate: 5.5, vibCents: 12,
    reeds: [
      { type: 'sawtooth', mult: 1, detune: 0, gain: 0.3 },
      { type: 'square',   mult: 1, detune: 4, gain: 0.1 },
    ],
  },
  harmonica: {
    peak: 0.3, attack: 0.015, release: 0.05,
    lp: 1800, lpK: 0.5, sweep: 0,
    vibRate: 6, vibCents: 6,
    reeds: [
      { type: 'square',   mult: 1, detune: 0,  gain: 0.15 },
      { type: 'sawtooth', mult: 1, detune: -4, gain: 0.12 },
      { type: 'sine',     mult: 2, detune: 0,  gain: 0.12 },
    ],
  },
  saxophone: {
    peak: 0.3, attack: 0.06, release: 0.1,
    lp: 700, lpK: 1.5, sweep: 1000,
    vibRate: 5, vibCents: 18,
    reeds: [
      { type: 'sawtooth', mult: 1, detune: -3, gain: 0.22 },
      { type: 'square',   mult: 1, detune: 3,  gain: 0.1 },
    ],
  },
};

// Trummönster: [position i takten i taktslag, typ]. k = bastrumma, s = virveltrumma, h = hi-hat
const PATTERNS = {
  rock: [
    [0,'k'], [2,'k'], [1,'s'], [3,'s'],
    [0,'h'], [0.5,'h'], [1,'h'], [1.5,'h'], [2,'h'], [2.5,'h'], [3,'h'], [3.5,'h'],
  ],
  polka: [
    [0,'k'], [1,'k'], [2,'k'], [3,'k'], [1,'s'], [3,'s'],
    [0.5,'h'], [1.5,'h'], [2.5,'h'], [3.5,'h'],
  ],
  swing: [
    [0,'k'], [2,'k'], [1,'s'], [3,'s'],
    [0,'h'], [0.667,'h'], [1,'h'], [1.667,'h'], [2,'h'], [2.667,'h'], [3,'h'], [3.667,'h'],
  ],
};

let ctx = null;
let noiseBuf = null;
let timer = null;
let state = null;

function toMidi(name) {
  const m = name.match(/^([A-Ga-g])(#|b)?(-?\d)$/);
  if (!m) return null;
  let v = (parseInt(m[3]) + 1) * 12 + OFFS[m[1].toUpperCase()];
  if (m[2] === '#') v++;
  if (m[2] === 'b') v--;
  return v;
}

// Tolkar en stämma, t.ex. "C4 1 E4 1 R 2"
function parseVoice(str, bar) {
  const tok = str.split(/\s+/).filter(Boolean);
  if (tok.length % 2 !== 0) throw new Error(t('errLenMissing', bar));
  const notes = [];
  let beats = 0;
  for (let i = 0; i < tok.length; i += 2) {
    const dur = parseFloat(tok[i + 1]);
    if (!(dur > 0)) throw new Error(t('errLenInvalid', bar, tok[i]));
    const isRest = /^R$/i.test(tok[i]);
    const midi = isRest ? null : toMidi(tok[i]);
    if (!isRest && midi === null) throw new Error(t('errNote', bar, tok[i]));
    notes.push({ midi, dur });
    beats += dur;
  }
  return { notes, beats };
}

function parseBars(text) {
  const bars = [];
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line || !/\d/.test(line)) continue;   // hoppar över rubriker

    const cells = line.split(/\t|\|/).map(s => s.trim());
    let chord = '', melStr, basStr = '';
    if (cells.length >= 4)       { chord = cells[1]; melStr = cells[2]; basStr = cells[3]; }
    else if (cells.length === 3) { chord = cells[0]; melStr = cells[1]; basStr = cells[2]; }
    else if (cells.length === 2) { melStr = cells[0]; basStr = cells[1]; }
    else                         { melStr = cells[0]; }

    const num = bars.length + 1;
    const mel = parseVoice(melStr, num);
    const bas = basStr ? parseVoice(basStr, num) : { notes: [], beats: mel.beats };
    if (Math.abs(mel.beats - bas.beats) > 1e-6) {
      throw new Error(t('errBeats', num, mel.beats, bas.beats));
    }
    bars.push({ num, chord, mel: mel.notes, bas: bas.notes, beats: mel.beats });
  }
  if (bars.length === 0) throw new Error(t('errNoBars'));
  return bars;
}

// Ett instrument: en ton. inst = nyckel i INST, vol = volymmultiplikator
function voice(t0, freq, dur, bellows, inst, isBass, vol) {
  const p = INST[inst];
  const end = t0 + dur;
  const peak = p.peak * vol * (isBass ? 0.85 : 1);
  const a = Math.min(p.attack, dur * 0.4);

  const out = ctx.createGain();
  out.gain.setValueAtTime(0, t0);
  out.gain.linearRampToValueAtTime(peak, t0 + a);
  out.gain.setValueAtTime(peak, Math.max(t0 + a + 0.01, end - p.release));
  out.gain.linearRampToValueAtTime(0, end);

  // Balgtremolo, bara för dragspel
  if (inst === 'accordion') {
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 5.5;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = bellows * (isBass ? 0.04 : 0.12);
    lfo.connect(lfoGain).connect(out.gain);
    lfo.start(t0);
    lfo.stop(end + 0.05);
  }

  // Filter, eventuellt med öppnande "attack" (trumpet, sax)
  const cutoff = isBass ? 400 + freq * 3 : p.lp + freq * p.lpK;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.Q.value = 2;
  lp.frequency.setValueAtTime(cutoff, t0);
  if (p.sweep) lp.frequency.linearRampToValueAtTime(cutoff + p.sweep, t0 + a * 3);
  out.connect(lp).connect(ctx.destination);

  // Vibrato (tonhöjdsmodulering i cent)
  let vibGain = null;
  if (p.vibRate > 0) {
    const vib = ctx.createOscillator();
    vib.frequency.value = p.vibRate;
    vibGain = ctx.createGain();
    vibGain.gain.value = p.vibCents;
    vib.connect(vibGain);
    vib.start(t0);
    vib.stop(end + 0.05);
  }

  for (const r of p.reeds) {
    const o = ctx.createOscillator();
    o.type = r.type;
    o.frequency.value = freq * r.mult;
    o.detune.value = r.detune;
    if (vibGain) vibGain.connect(o.detune);
    const g = ctx.createGain();
    g.gain.value = r.gain;
    o.connect(g).connect(out);
    o.start(t0);
    o.stop(end + 0.05);
  }
}

// Spelar en stämma från starttiden t
function playVoice(t0, notes, beat, bellows, inst, isBass, vol) {
  let cur = t0;
  for (const n of notes) {
    const d = n.dur * beat;
    if (n.midi !== null) {
      voice(cur, 440 * 2 ** ((n.midi - 69) / 12), d, bellows, inst, isBass, vol);
    }
    cur += d;
  }
}

// Trummor
function makeNoise(c) {
  const buf = c.createBuffer(1, c.sampleRate, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

function kick(t0, v) {
  const o = ctx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t0);
  o.frequency.exponentialRampToValueAtTime(45, t0 + 0.12);
  const g = ctx.createGain();
  g.gain.setValueAtTime(v, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
  o.connect(g).connect(ctx.destination);
  o.start(t0);
  o.stop(t0 + 0.35);
}

function noiseHit(t0, v, hpFreq, decay) {
  const n = ctx.createBufferSource();
  n.buffer = noiseBuf;
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = hpFreq;
  const g = ctx.createGain();
  g.gain.setValueAtTime(v, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + decay);
  n.connect(hp).connect(g).connect(ctx.destination);
  n.start(t0, Math.random() * 0.5);
  n.stop(t0 + decay + 0.02);
}

function snare(t0, v) { noiseHit(t0, v * 0.6, 1200, 0.18); }
function hat(t0, v)   { noiseHit(t0, v * 0.2, 7000, 0.05); }

// Spelar ett trummönster för en takt
function playDrums(t0, beats, style, beat, vol) {
  const pat = PATTERNS[style];
  if (!pat) return;
  for (const [off, kind] of pat) {
    if (off >= beats) continue;
    const t1 = t0 + off * beat;
    if (kind === 'k') kick(t1, vol);
    else if (kind === 's') snare(t1, vol);
    else hat(t1, vol);
  }
}

// Schemaläggaren: håller alltid ca 0.5 s framför
function tick() {
  if (!state || !ctx) return;
  const now = ctx.currentTime;
  const horizon = now + LOOKAHEAD;

  while (state.nextTime < horizon) {
    if (state.maxPasses > 0 && state.passesDone >= state.maxPasses) break;

    const passNo = state.passesDone + 1;
    let cur = state.nextTime;
    for (const bar of state.bars) {
      playVoice(cur, bar.mel, state.beat, state.bellows, state.melInst, false, state.melVol);
      playVoice(cur, bar.bas, state.beat, state.bellows, state.basInst, true, state.basVol);
      playDrums(cur, bar.beats, state.drumStyle, state.beat, state.drumVol);
      state.events.push({ time: cur, pass: passNo, bar: bar.num, chord: bar.chord });
      cur += bar.beats * state.beat;
    }
    state.passesDone++;
    state.endTime = cur;
    state.nextTime = cur + state.gapSec;
  }

  // Visa takten som hörs just nu
  while (state.events.length && state.events[0].time <= now) {
    const ev = state.events.shift();
    const varv = state.maxPasses > 0
      ? t('passOf', ev.pass, state.maxPasses)
      : t('pass', ev.pass);
    const ack = ev.chord ? ` · ${ev.chord}` : '';
    document.getElementById('status').textContent = `${varv} · ${t('bar', ev.bar)}${ack}`;
  }

  // Sista varvet är klart
  if (state.maxPasses > 0 && state.passesDone >= state.maxPasses && now > state.endTime) {
    stop();
    document.getElementById('status').textContent = t('done');
  }
}

function stop() {
  clearInterval(timer);
  timer = null;
  state = null;
  if (ctx) { ctx.close(); ctx = null; }
  document.getElementById('status').textContent = '';
}

document.getElementById('play').onclick = () => {
  let bars;
  try {
    bars = parseBars(document.getElementById('notes').value);
  } catch (e) {
    alert(e.message);
    return;
  }
  stop();

  const val = id => document.getElementById(id).value;
  const bpm = parseFloat(val('bpm')) || 120;
  const beat = 60 / bpm;

  ctx = new AudioContext();
  noiseBuf = makeNoise(ctx);

  state = {
    bars, beat,
    bellows: parseFloat(val('bellows')),
    melInst: val('melInst'),
    basInst: val('basInst'),
    drumStyle: val('drumStyle'),
    melVol: parseFloat(val('melVol')),
    basVol: parseFloat(val('basVol')),
    drumVol: parseFloat(val('drumVol')),
    gapSec: Math.max(0, parseFloat(val('gap')) || 0) * beat,
    nextTime: ctx.currentTime + 0.1,
    passesDone: 0,
    maxPasses: Math.max(0, parseInt(val('repeats')) || 0),
    endTime: 0,
    events: [],
  };

  timer = setInterval(tick, TICK_MS);
  tick();
};

document.getElementById('stop').onclick = stop;

applyLang();
</script>
</body>
